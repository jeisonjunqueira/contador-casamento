<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contagem Regressiva - Casamento</title>

  <style>
    body {
      margin: 0;
      font-family: 'Georgia', serif;
    }

    /* layout principal */
    .page {
      display: flex;
      height: 100vh;
    }

    /* lado esquerdo (imagem) */
    .left {
      flex: 1;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .left img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* lado direito (cores do convite) */
    .right {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;

      background: linear-gradient(
        135deg,
        #f5efe6 0%,
        #efe4d2 50%,
        #e4d2b3 100%
      );
    }

    /* container */
    .container {
      text-align: center;
      background: rgba(255,255,255,0.85);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      color: #6b4f3b;
      max-width: 90%;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 15px;
      color: #8b6a4e;
    }

    .message {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 30px;
      color: #6b4f3b;
    }

    .countdown {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .time-box {
      background: #fff;
      padding: 20px;
      border-radius: 15px;
      min-width: 80px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
      border: 1px solid #e0d2bd;
    }

    .number {
      font-size: 2rem;
      font-weight: bold;
      color: #8b6a4e;
    }

    .label {
      font-size: 0.9rem;
      opacity: 0.8;
      color: #6b4f3b;
    }

    .footer {
      margin-top: 20px;
      font-style: italic;
      color: #8b6a4e;
    }

    /* responsivo */
    @media (max-width: 768px) {
      .page {
        flex-direction: column;
      }

      .left, .right {
        height: 50vh;
      }

      .container {
        padding: 25px;
      }

      h1 {
        font-size: 1.6rem;
      }

      .message {
        font-size: 1rem;
      }

      .time-box {
        min-width: 60px;
        padding: 15px;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <div class="left">
      <img src="images/foto.jpg" alt="Foto do casal">
    </div>

    <div class="right">
      <div class="container">
        <h1>💍 Nosso Casamento</h1>

        <div class="message">
          Nossa história começou há 10 anos e hoje, damos um passo de fé:<br>
          celebrar o sacramento do Matrimônio.
          <br>
          <br>Estamos contando os dias para esse momento especial!
        </div>

        <div class="countdown">
          <div class="time-box">
            <div id="days" class="number">0</div>
            <div class="label">Dias</div>
          </div>

          <div class="time-box">
            <div id="hours" class="number">0</div>
            <div class="label">Horas</div>
          </div>

          <div class="time-box">
            <div id="minutes" class="number">0</div>
            <div class="label">Minutos</div>
          </div>

          <div class="time-box">
            <div id="seconds" class="number">0</div>
            <div class="label">Segundos</div>
          </div>
        </div>

        <div class="footer">23 de maio de 2026 às 19:30</div>
      </div>
    </div>

  </div>

  <script>
    const targetDate = new Date("2026-05-23T19:30:00-03:00");

    function updateCountdown() {
      const now = new Date();
      const diff = targetDate - now;

      if (diff <= 0) {
        document.querySelector('.container').innerHTML =
          "<h1>💖 Chegou o grande dia!</h1>";
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById('days').textContent = days;
      document.getElementById('hours').textContent = hours;
      document.getElementById('minutes').textContent = minutes;
      document.getElementById('seconds').textContent = seconds;
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>
